# Jenkins controller for the Student Attendance Management Portal.
#
# Installed from a container image rather than the usual WAR download:
# get.jenkins.io is refused by the lab's egress policy (see
# docs/00-environment-prerequisites.md section 3.2). The image is a
# supported installation method, pins the controller version, and keeps
# JENKINS_HOME in a named volume so job configuration and build history
# survive a restart.

services:
  jenkins:
    image: attendance-jenkins:1.0        # built by jenkins/build-controller.sh
    container_name: attendance-jenkins
    restart: unless-stopped
    user: root                            # needed to use the mounted docker socket

    # Host networking, for two reasons specific to this lab:
    #   - the session's HTTPS proxy listens on loopback only, so a bridged
    #     container cannot reach it;
    #   - the pipeline deploys the application to the host and then probes
    #     its health endpoint.
    # The controller therefore listens on 8081; 8080 belongs to the
    # application itself.
    network_mode: host

    environment:
      JENKINS_OPTS: "--httpPort=8081"
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.model.DownloadService.noSignatureCheck=true
        -Dhttps.proxyHost=127.0.0.1
        -Dhttps.proxyPort=40387
        -Dhttp.proxyHost=127.0.0.1
        -Dhttp.proxyPort=40387
        -Dhttp.nonProxyHosts=localhost|127.0.0.1
      CASC_JENKINS_CONFIG: /var/jenkins_conf/casc.yaml
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"
      # Maven runs inside the controller; point it at the mounted install.
      MAVEN_HOME: /opt/maven

      # git reads these (the JVM does not, which is why the same endpoint
      # is also passed as system properties in JAVA_OPTS above).
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"

      # Maven's own JVM needs the proxy and a truststore that contains the
      # proxy's CA. It is pointed at the host's Java truststore, mounted
      # below - the same store the developer's own builds use, so a build
      # that works on the workstation works here for the same reason.
      MAVEN_OPTS: >-
        -Dhttps.proxyHost=127.0.0.1
        -Dhttps.proxyPort=40387
        -Dhttp.proxyHost=127.0.0.1
        -Dhttp.proxyPort=40387
        -Dhttp.nonProxyHosts=localhost|127.0.0.1
        -Djavax.net.ssl.trustStore=/var/jenkins_conf/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
      PATH: /opt/maven/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_conf/casc.yaml:ro

      # The pipeline builds images and replaces containers (Stages 11-12),
      # so the controller drives the host's Docker daemon rather than
      # running one of its own.
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro

      # Maven is bind-mounted rather than installed: apt cannot reach
      # deb.debian.org from this lab. Same pinned 3.9.x the developer uses.
      - /opt/maven:/opt/maven:ro
      - maven_repo:/root/.m2

      # Trust the proxy CA for anything the controller fetches at runtime:
      # the system bundle for curl and git, and the host's Java truststore
      # for Maven (MAVEN_OPTS above points at it).
      - /root/.ccr/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /etc/ssl/certs/java/cacerts:/var/jenkins_conf/truststore.jks:ro

volumes:
  jenkins_home:
  maven_repo:
