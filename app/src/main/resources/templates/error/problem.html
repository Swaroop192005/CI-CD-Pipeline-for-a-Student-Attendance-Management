<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Problem')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('')}"></header>
<main>
  <div class="card" data-testid="problem-card">
    <h1 data-testid="problem-status" th:text="${statusCode} + ' - ' + ${statusText}">403 - Not permitted</h1>
    <p class="subtitle" data-testid="problem-detail" th:text="${detail}">Detail</p>
    <div class="actions">
      <a class="btn btn-secondary" th:href="@{/attendance}" data-testid="problem-back">Back to attendance</a>
      <a class="btn btn-secondary" th:href="@{/dashboard}">Dashboard</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
