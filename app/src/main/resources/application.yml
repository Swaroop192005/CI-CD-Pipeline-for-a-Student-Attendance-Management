# Student Attendance Management Portal - application configuration
#
# Every setting below can be overridden by an environment variable using
# Spring Boot's relaxed binding (for example SERVER_PORT,
# SPRING_DATASOURCE_URL, ATTENDANCE_ENVIRONMENT). Stage 8 parameterises
# ATTENDANCE_ENVIRONMENT from the Jenkins pipeline and Stage 13 templates
# the whole set from Ansible. See docs/stage-03 section 6.4.

spring:
  application:
    name: attendance-portal

  sql:
    init:
      # Not "embedded", which is the default: Spring Boot only classes an
      # in-memory URL as embedded, and this application runs H2 in file mode,
      # so schema.sql would silently never run and the passkey tables would
      # not exist. The DDL is written "if not exists" because "always" means
      # every start.
      mode: always

  datasource:
    # File mode keeps data across restarts; the container maps a volume here.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/attendance;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    # schema.sql creates the two passkey tables, which are not JPA entities.
    # Deferring it means Hibernate has finished with its own tables first, so
    # the two mechanisms cannot race on the same connection.
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Identical whether the WAR runs embedded or is deployed to Tomcat as
    # attendance.war, so every URL in docs and tests is stable.
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/attendance}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

attendance:
  environment: ${ATTENDANCE_ENVIRONMENT:local}
  eligibility-threshold: ${ATTENDANCE_ELIGIBILITY_THRESHOLD:75}
  shortage-threshold: ${ATTENDANCE_SHORTAGE_THRESHOLD:35}
  # WebAuthn ties a passkey to an origin on purpose: a credential created for
  # one site cannot be replayed against another. localhost is the exception
  # browsers make for development, which is why the demonstration works
  # without a certificate.
  passkey:
    relying-party-id: ${ATTENDANCE_PASSKEY_RP_ID:localhost}
    relying-party-name: ${ATTENDANCE_PASSKEY_RP_NAME:Student Attendance Portal}
    allowed-origins: ${ATTENDANCE_PASSKEY_ORIGINS:http://localhost:8080,http://localhost:8100,http://localhost:8101,http://localhost:8090,http://localhost:8091}
    # Whether marking attendance demands a fresh passkey assertion, not just
    # a session that began with one. Off by default: it is the stronger
    # control, but it makes enrolling a passkey a prerequisite for being
    # marked present at all, and a student who has not enrolled simply
    # cannot attend. Turn it on to demonstrate presence-at-the-moment.
    required-to-mark: ${ATTENDANCE_PASSKEY_REQUIRED_TO_MARK:false}
  seed-data: ${ATTENDANCE_SEED_DATA:true}

info:
  app:
    name: Student Attendance Management Portal
    environment: ${attendance.environment}

logging:
  level:
    root: INFO
    com.college.attendance: INFO
