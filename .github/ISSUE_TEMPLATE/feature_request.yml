name: Feature / user story
description: A backlog item for the portal
title: "[story]: "
labels: ["type:feature"]
body:
  - type: input
    id: story-id
    attributes:
      label: Backlog ID
      description: The US-xx identifier from docs/stage-02-agile-planning.md
      placeholder: "US-08"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      value: |
        As a <role>
        I want to <capability>
        so that <outcome>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, one per criterion. Each must be testable.
      value: |
        - [ ] Given ... when ... then ...
        - [ ] Given ... when ... then ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: MoSCoW priority
      options: [Must, Should, Could, Won't]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Estimate (story points)
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Project stage
      placeholder: "stage-06"
    validations:
      required: true
