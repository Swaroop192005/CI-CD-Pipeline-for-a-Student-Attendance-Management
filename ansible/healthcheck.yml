---
# Standalone health check, for use after a deployment or on a schedule.
#
#   ansible-playbook healthcheck.yml
#
# Deliberately separate from site.yml: checking whether a node is healthy
# should not require running a provisioning playbook against it.

- name: Check the attendance service
  hosts: attendance_servers
  become: true
  gather_facts: false

  tasks:
    - name: Check the systemd unit is active
      ansible.builtin.command: systemctl is-active attendance
      register: unit_state
      changed_when: false
      failed_when: unit_state.stdout.strip() != 'active'

    - name: Check the application answers through nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port }}{{ health_path }}"
        status_code: 200
        return_content: true
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health.status is defined and health.status == 200
      changed_when: false

    - name: Read which release is live
      ansible.builtin.slurp:
        src: "{{ app_config_dir }}/attendance.env"
      register: env_file

    - name: Resolve the current symlink
      ansible.builtin.command: readlink -f {{ app_current_link }}
      register: current_target
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Unit        : {{ unit_state.stdout }}"
          - "Health      : {{ health.json.status }}"
          - "Live release: {{ current_target.stdout | basename }}"
          - "Configured  : {{ (env_file.content | b64decode).split('APP_VERSION=')[1] | trim }}"
