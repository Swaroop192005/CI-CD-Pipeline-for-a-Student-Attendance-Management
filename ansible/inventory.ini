# Inventory for the Student Attendance Management Portal.
#
# The target node is a container in this lab rather than a VM, reached over
# SSH on a mapped port. Nothing in the playbook depends on that: the same
# inventory entry pointed at a real host's address and port 22 would
# provision it identically, because the playbook manages packages, users,
# directories, files, ports and systemd services, not containers.

[attendance_servers]
attendance-node ansible_host=127.0.0.1 ansible_port=2222

[attendance_servers:vars]
ansible_user=root
ansible_ssh_private_key_file=targetnode/id_node
ansible_python_interpreter=/usr/bin/python3

[all:vars]
# The lab's egress is proxied, and the managed node needs the same setting
# for anything it fetches itself - apt, in practice.
#
# The address is the Docker bridge gateway, not 127.0.0.1: the session's
# proxy listens on loopback only, where "loopback" from inside the node
# means the node itself. ansible/lab/proxy-relay.py bridges the two. On a
# network where the node reaches its mirrors directly, leave this empty and
# the playbook skips the apt proxy task entirely.
proxy_url=http://172.17.0.1:40388
