---
# Base configuration every application server needs: the service account,
# the directory layout and the handful of utilities the other roles and the
# operator rely on.

- name: Ensure the service group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    gid: "{{ app_gid }}"
    system: true
    state: present

- name: Ensure the service account exists
  # A dedicated, non-login system account. The application has no business
  # running as root, and nobody has any business signing in as it.
  ansible.builtin.user:
    name: "{{ app_user }}"
    uid: "{{ app_uid }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_root }}"
    create_home: false
    state: present

- name: Ensure the directory layout exists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(app_user) }}"
    group: "{{ item.group | default(app_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_root }}",         mode: "0755" }
    # Releases are kept rather than overwritten, so that rolling back is a
    # matter of repointing a symlink instead of fetching an old artefact.
    - { path: "{{ app_releases_dir }}", mode: "0755" }
    - { path: "{{ app_data_dir }}",     mode: "0750" }
    - { path: "{{ app_log_dir }}",      mode: "0750" }
    # Config is root-owned and group-readable: the service reads it, the
    # service account must not be able to rewrite it.
    - { path: "{{ app_config_dir }}",   mode: "0750", owner: root }
  loop_control:
    label: "{{ item.path }}"

- name: Ensure the operator utilities are installed
  ansible.builtin.apt:
    name:
      - curl          # health probes
      - unzip         # artefact inspection
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure log rotation is configured
  # Without this the application log grows until the disk fills, which is a
  # slow outage that looks like a sudden one.
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/attendance
    owner: root
    group: root
    mode: "0644"
